name: Prepare release

# The run list shows the requested tag together with the workflow name.
# `github.workflow` repeats the `name` value from one place, so a rename of the
# workflow also updates the run name.
run-name: '${{ github.workflow }} ${{ inputs.tag }}'

description: >-
  Opens a release PR that finalizes CHANGELOG.md for the given tag.
  After merge, publish-release.yml takes over.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag WITH "v" prefix (e.g. v2.1.0, v2.1.0-beta.1)'
        required: true
        type: string

# `contents: write` — push the release-bump branch
# `id-token: write` — Octopass OIDC for PR creation
permissions:
  contents: write
  id-token: write

jobs:
  create-release-pr:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/create-release-pr.yml@master
    with:
      tag: ${{ inputs.tag }}
      team: filters
